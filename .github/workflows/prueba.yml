name: Prueba trazas
on:
  push:
    branches: [prueba-trazas]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd tracker && python3 - <<'PY'
          import sys; sys.path.insert(0, '.')
          import track as t
          for h in ['4d210e']:
              pts = t.fetch_trace(h)
              print('puntos', len(pts))
              air = [p for p in pts if p[3] != 'ground']
              # simular que el rastreador vio el avión por primera vez 30 min después del primer punto en el aire
              if air:
                  first = air[0][0] + 1800
                  print('RESULTADO', t.takeoff_from_trace(pts, first))
          PY
